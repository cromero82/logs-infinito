##################### Grafana - custom.ini (logs-infinito) #####################
# Sobrescribe defaults.ini SOLO con lo necesario para nuestro entorno local.
# Ruta de carga: Grafana lee primero defaults.ini y despues custom.ini si existe.
# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
#################################################################################

[server]
# Puerto HTTP donde escucha Grafana
http_port = 3000
# Solo escuchar en localhost (no exponer a la red)
http_addr = 127.0.0.1
# Dominio mostrado en URLs absolutas
domain = localhost
# URL raiz que ven los usuarios (util para iframes desde el front Angular)
root_url = http://localhost:3000/
# Permitir embedding desde la app frontend (necesario para incrustar paneles)
serve_from_sub_path = false

[security]
# Permitir embed de iframes (para incluir paneles en infinito-ai-front)
allow_embedding = true
# Cookie samesite relajada para que los iframes funcionen entre puertos
cookie_samesite = lax

[auth.anonymous]
# Acceso anonimo de SOLO LECTURA al organisation principal.
# Util para que el front Angular incruste paneles sin pedir login al cajero.
enabled = true
org_name = Main Org.
org_role = Viewer

[users]
# No permitir auto-registro publico
allow_sign_up = false

[analytics]
# Apagar el envio de telemetria a grafana.com
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
# Log a CONSOLA y a archivo (data/log). Importante 'console' para ver en pantalla
# cuando se arranca a mano; 'file' es lo que el launcher Java leera luego.
mode = console file
level = info

[paths]
# Donde guardar la DB SQLite, sesiones, plugins descargados, logs.
# Rutas RELATIVAS al directorio donde se ejecuta grafana.exe (homepath).
data = data
logs = data/log
plugins = data/plugins
provisioning = conf/provisioning

[dashboards]
# Recargar provisioning cada 60s (util mientras diseñamos paneles)
versions_to_keep = 20
